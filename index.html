<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8b6547" />
  <meta name="description" content="withmyhi의 내돈내산 추천템" />
  <title>withmyhi | 인포크링크</title>
  <style>
    :root {
      font-family: Pretendard, "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      color: #1a211e;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #8b6547;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #8b6547;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100vh;
      padding-top: 32px;
    }

    .profile {
      width: min(440px, 100%);
      min-height: calc(100vh - 32px);
      margin: 0 auto;
      overflow: hidden;
      background: #faece1;
      border-radius: 32px 32px 0 0;
    }

    .topbar {
      height: 56px;
      padding: 32px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
    }

    .intro {
      padding: 0 16px 32px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      margin: 12px 0 0;
      font-size: 16px;
      line-height: 20px;
      font-weight: 700;
    }

    .tagline {
      margin: 0;
      font-size: 12px;
      line-height: 20px;
    }

    .business {
      margin-top: 16px;
      height: 41px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 10px;
      border: 1px solid rgba(0, 0, 0, .06);
      border-radius: 12px;
      color: #242424;
      background: rgba(255, 255, 255, .5);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .business svg {
      width: 18px;
      height: 18px;
    }

    .links {
      padding: 0 16px 24px;
    }

    .note {
      margin: 0 0 16px;
      padding: 12px 0 8px;
      color: #343434;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
    }

    .product {
      min-height: 76px;
      margin-top: 16px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 0;
      text-decoration: none;
      color: #1c2024;
      background: #fff;
      border-radius: 9999px;
      box-shadow: 0 2px 4px rgba(0, 0, 0, .12);
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .product:first-of-type {
      margin-top: 0;
    }

    .product:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, .14);
    }

    .product:active {
      transform: scale(.985);
    }

    .product img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
    }

    .product span {
      flex: 1;
      padding: 0 12px;
      text-align: center;
      white-space: pre-line;
      font-size: 14px;
      line-height: 20px;
    }

    .section-note {
      margin: 0;
      padding: 12px 0 8px;
      text-align: center;
      color: #343434;
      font-size: 14px;
      font-weight: 600;
      line-height: 21px;
    }

    .footer {
      padding: 24px 16px 40px;
      display: flex;
      justify-content: center;
    }

    .footer a {
      min-height: 46px;
      padding: 12px 16px 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border-radius: 100px;
      color: #1c2024;
      background: rgba(255, 255, 255, .95);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .brand {
      letter-spacing: -.3px;
    }

    .arrow {
      width: 16px;
      height: 16px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 12px);
      padding: 11px 16px;
      border-radius: 24px;
      background: #25211e;
      color: white;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width:480px) {
      .page {
        padding-top: 0;
      }

      .profile {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .topbar {
        padding-top: max(16px, env(safe-area-inset-top));
      }

      .footer {
        padding-bottom: max(40px, env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <article class="profile" aria-label="withmyhi 프로필">
      <div class="topbar">
        <button class="icon-button" id="share" aria-label="프로필 공유" title="공유">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V3m0 0L7.5 7.5M12 3l4.5 4.5" />
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
          </svg>
        </button>
        <button class="icon-button" id="notify" aria-label="알림 안내" title="알림">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" />
            <path d="M10 21h4" />
          </svg>
        </button>
      </div>
      <header class="intro">
        <img class="avatar" src="https://d13k46lqgoj3d6.cloudfront.net/2026/10/8/2026-10-8-1791429801017.webp?f=avif"
          alt="withmyhi 프로필 사진" />
        <h1>withmyhi</h1>
        <p class="tagline">내돈내산 추천템💕</p>
        <button class="business" id="business">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2" />
            <path d="m3 6 9 7 9-7" />
          </svg>
          비즈니스 제안
        </button>
      </header>
      <section class="links" aria-label="추천 상품">
        <p class="note">"이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공합니다."</p>
        <a class="product" href="https://link.coupang.com/a/hFJGHqsKxo" target="_blank" rel="noopener noreferrer">
          <img src="https://d13k46lqgoj3d6.cloudfront.net/2026/10/8/2026-10-8-1791429290777.webp?w=300&f=avif"
            alt="일회용 기저귀 패드" />
          <span>집에서나 밖에서나 필수템
            [일회용 기저귀 패드]
            최저가 바로배송💖</span>
        </a>
        <a class="product" href="https://link.coupang.com/a/hFJtvJEToi" target="_blank" rel="noopener noreferrer">
          <img src="https://d13k46lqgoj3d6.cloudfront.net/2026/10/8/2026-10-8-1791429084247.webp?w=300&f=avif"
            alt="분유 소분통" />
          <span>분유타는 시간 단축
            [분유소분통]
            최저가 바로배송😀</span>
        </a>
        <a class="product" href="https://link.coupang.com/a/hMxqVHg1g4" target="_blank" rel="noopener noreferrer">
          <img src="https://d13k46lqgoj3d6.cloudfront.net/2026/10/12/2026-10-12-1791816313400.webp?w=300&f=avif"
            alt="연고 제품" />
          <span>연고 바로배송 최저가</span>
        </a>
        <p class="section-note">목 연고 스티모린, 마데카솔 사용했어요!👍</p>
      </section>
      <footer class="footer">
        <a href="https://inpock.co.kr" target="_blank" rel="noopener noreferrer"><span
            class="brand">INPOCK</span><span>·</span><span>나만의 프로필을 만들어보세요</span><svg class="arrow" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m9 18 6-6-6-6" />
          </svg></a>
      </footer>
    </article>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
  <script>
    const toast = document.querySelector('.toast');
    let toastTimer;
    function message(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2200); }
    document.querySelector('#share').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(location.href); message('프로필 링크를 복사했어요'); }
      catch { message('브라우저 메뉴에서 링크를 공유해 주세요'); }
    });
    document.querySelector('#notify').addEventListener('click', () => message('새 소식은 프로필에서 확인해 주세요'));
    document.querySelector('#business').addEventListener('click', () => message('비즈니스 제안은 프로필 운영자에게 문의해 주세요'));
  </script>
</body>

</html>
